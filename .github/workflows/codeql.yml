name: codeql

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Weekly, so a newly published query finds old code too.
    - cron: "27 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: analyze javascript
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      # JavaScript needs no compilation, so there is no build step here.

      - name: Analyze
        uses: github/codeql-action/analyze@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
        with:
          category: "/language:${{ matrix.language }}"
