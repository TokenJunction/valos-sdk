name: Release

on:
  release:
    types: [published]

permissions: {}

jobs:
  sign:
    name: Sign release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Leak guard
        run: node scripts/leak-guard.mjs

      - name: License notices
        run: node scripts/license-notice-check.mjs

      - name: Build source archive
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node scripts/prepare-release-archive.mjs

      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4

      - name: Sign archive and checksums
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(dist/*.tar.gz)
          if [[ ${#archives[@]} -ne 1 ]]; then
            echo "expected exactly one source archive" >&2
            exit 1
          fi
          archive="${archives[0]}"
          cosign sign-blob --yes --bundle "${archive}.sigstore.json" "$archive"
          cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS
          identity="^https://github\\.com/TokenJunction/valos-sdk/\\.github/workflows/release\\.yml@${RELEASE_REF}$"
          cosign verify-blob \
            --bundle "${archive}.sigstore.json" \
            --certificate-identity-regexp "$identity" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          cosign verify-blob \
            --bundle dist/SHA256SUMS.sigstore.json \
            --certificate-identity-regexp "$identity" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            dist/SHA256SUMS

      - name: SLSA build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

      - name: Upload release assets
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" dist/*.tar.gz dist/SHA256SUMS dist/*.sigstore.json --clobber
